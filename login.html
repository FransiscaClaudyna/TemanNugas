<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

</head>
<body>

    <h1>TemanNugas</h1>

    <form action="index.html" method="get">

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Masukkan email"
            required
        >
        <br><br>

        <label for="password">Password:</label><br>
        <input
            type="password"
            id="password"
            name="password"

        >
        <br><br>

        <button type="submit">Login</button>
    </form>

</body>
